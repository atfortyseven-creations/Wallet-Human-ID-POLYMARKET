<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Network Presentation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fafafa;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #111111;
        }

        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: #fafafa;
            transition: opacity 1s ease;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 2px;
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            color: #000;
        }
        
        .subtitle-intro {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 50px;
            font-weight: 400;
            letter-spacing: 1px;
            text-align: center;
            max-width: 600px;
        }

        .play-btn {
            padding: 18px 50px;
            border: 1px solid #000;
            background: #000;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            font-weight: 600;
        }

        .play-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        #player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 50%, #ffffff 0%, #f0f0f0 100%);
        }

        /* PREMIUM AZTEC BRANDING - ABSOLUTE CENTER AND MASSIVE */
        .aztec-premium-logo {
            position: absolute;
            bottom: 2%; 
            left: 50%; /* EXACT CENTER OF THE SCREEN */
            transform: translateX(-50%);
            height: 40%; /* MASSIVE */
            max-height: 450px; 
            width: auto;
            object-fit: contain;
            z-index: 1000;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.15));
            border-radius: 24px;
        }

        /* 3D Black Titanium iPhone Pro Mockup Container */
        .phone-container {
            position: absolute;
            right: 12%; 
            top: 50%;
            transform: translateY(-50%);
            width: 380px; 
            height: 820px; 
            background: #000;
            border-radius: 50px;
            box-shadow: 0 0 0 12px #1a1a1a, 0 50px 100px rgba(0,0,0,0.2), inset 0 0 0 4px #333;
            overflow: hidden;
            opacity: 0;
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .phone-container.visible {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        /* TEXT UNDER PHONE */
        .powered-by {
            position: absolute;
            right: 12%; 
            top: 50%;
            transform: translateY(440px);
            width: 380px; 
            text-align: center;
            font-size: 0.95rem;
            color: #555;
            z-index: 50;
            letter-spacing: 0.5px;
            font-weight: 300;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .powered-by strong {
            font-weight: 600;
            color: #111;
        }

        .powered-by.visible {
            opacity: 1;
        }

        /* Dynamic Island */
        .phone-notch {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            z-index: 20;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .screenshot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: all 1.5s ease;
            position: absolute;
            inset: 0;
            opacity: 0;
            border-radius: 38px;
            transform: scale(1.05);
        }
        
        .screenshot.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Typography for presentation */
        .text-container {
            position: absolute;
            left: 8%;
            top: 40%; 
            transform: translateY(-50%); 
            width: 40%; 
            z-index: 50;
        }

        .presentation-text {
            font-size: 2.6rem;
            font-weight: 300;
            line-height: 1.4;
            color: #111;
            opacity: 0;
            margin: 0;
            position: absolute;
            width: 100%;
        }

        .highlight {
            font-weight: 600;
            color: #3b82f6;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
        }

        .code-highlight {
            font-family: monospace;
            background: rgba(241, 245, 249, 0.9);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 2.1rem;
            color: #334155;
            font-weight: 600;
            letter-spacing: -0.5px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        @keyframes textFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-15px); }
        }

        #logo-final {
            position: absolute;
            z-index: 100;
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            height: 100%;
        }

        #logo-final h2 {
            font-size: 5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 2px;
            color: #000;
        }

        #logo-final .tags {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #666;
            margin-top: 40px;
        }

    </style>
</head>
<body>

    <div id="intro-screen">
        <h1>Whale Network</h1>
        <p class="subtitle-intro">Sovereign Grade Identity Terminal and Cryptographic Analytics Ecosystem</p>
        <button class="play-btn" onclick="startTrailer()">Start Experience</button>
    </div>

    <div id="player">
        
        <img src="file:///C:/Users/admin/Desktop/stu%20dioprovenance/Gemini_Generated_Image_dzte5edzte5edzte%20(2).png" class="aztec-premium-logo" alt="Aztec Network Logo">

        <div class="text-container" id="text-wrapper">
        </div>

        <div class="phone-container" id="main-phone">
            <div class="phone-notch"></div>
            <img src="file:///C:/Users/admin/Desktop/stu%20dioprovenance/photo_2026-06-02_09-40-16%20(2).jpg" class="screenshot" id="screen-create">
            <img src="file:///C:/Users/admin/Desktop/stu%20dioprovenance/photo_2026-06-02_09-40-16%20(3).jpg" class="screenshot" id="screen-dashboard">
            <img src="file:///C:/Users/admin/Desktop/stu%20dioprovenance/photo_2026-06-02_09-40-16.jpg" class="screenshot" id="screen-passport">
        </div>
        
        <div class="powered-by" id="credits">
            Powered by <strong>Whale Network</strong> | Engineered by <strong>Aztec Network</strong>
        </div>

        <div id="logo-final">
            <h2>Whale Network</h2>
            <p style="color: #666; font-size: 1.5rem; margin-top: 10px; font-weight: 300;">Public verification. Private data.</p>
            <div class="tags">
                <strong>@whalecosystem</strong> &nbsp;&nbsp;|&nbsp;&nbsp; <strong>@AztecLabs_</strong>
            </div>
        </div>

    </div>

    <script>
        const timeline = [
            // SCENE 1: Introduction
            { time: 1000, 
              text: "Welcome to <span class='highlight'>Whale Network</span>.", 
              spokenText: "Welcome to Whale Network. An advanced terminal ecosystem for the comprehensive management of digital assets and zero knowledge identities.",
              duration: 8000 },
            { time: 9500, 
              text: "Designed for sovereign operations and retail users alike.", 
              spokenText: "Designed to meet the demands of sovereign operations and retail users alike. The platform unites cross device state synchronisation and client side zero knowledge proof generation.",
              duration: 10000 },
            
            // SCENE 2: Dual Architecture
            { time: 20000, 
              text: "Operating under a <span class='highlight'>Unified Domain Dual Architecture</span>.", 
              spokenText: "Whale Network operates under a Unified Domain Dual Architecture. The web ecosystem dynamically adapts its execution layer to your device.",
              duration: 9000, 
              screen: 'screen-create' },
            { time: 29500, 
              text: "Desktop acts as a high computation channel with <span class='code-highlight'>Client Side Prover</span>.", 
              spokenText: "For users accessing the platform from desktop environments, the system establishes a high computation channel. Witness generation and circuit execution are wholly client side operations.",
              duration: 10000 },

            // SCENE 3: Mobile Handshake
            { time: 40000, 
              text: "Mobile functions as a <span class='highlight'>Handshake Enclave</span>.", 
              spokenText: "Mobile devices operate as a secure authorisation enclave. The interface asynchronously routes the encrypted request through secure tunnels to the linked PC session.",
              duration: 10000, 
              screen: 'screen-dashboard' },
            { time: 50500, 
              text: "Omnipresent Session Continuity across all your devices.", 
              spokenText: "This provides omnipresent session continuity. You experience an absolute fusion of your environments while all critical operations remain entrenched within the desktop layer.",
              duration: 10000 },

            // SCENE 4: Terminal Ecosystem
            { time: 61000, 
              text: "The core interface provides five dedicated <span class='highlight'>Analytical Modules</span>.", 
              spokenText: "The core interface is partitioned into five dedicated modules. Roadmap, Identity, Token, Network Map, and Privacy.",
              duration: 9000, 
              screen: 'screen-passport' },
            { time: 70500, 
              text: "Uniqueness is proved. Identity is never revealed.", 
              spokenText: "The Identity tab empowers users to attest complex attestation criteria using locally compiled Noir circuits. Uniqueness is proved. Identity is never revealed.",
              duration: 9000 },
            { time: 80000, 
              text: "Absolute control of the local environment returned to the user.", 
              spokenText: "The Privacy module guarantees that all encryption and secret storage operations function purely within a local Zero Knowledge context. Absolute control is returned to the user.",
              duration: 11000 },

            // OUTRO
            { time: 91500, triggerFinal: true }
        ];

        // Ensure voices are loaded ahead of time
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        function startTrailer() {
            // Request fullscreen
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            }

            // Unlock audio/speech context (requires user interaction)
            if ('speechSynthesis' in window) {
                let silent = new SpeechSynthesisUtterance('');
                silent.volume = 0;
                window.speechSynthesis.speak(silent);
            }

            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('player').style.opacity = '1';
                runTimeline();
            }, 1000);
        }

        function runTimeline() {
            let textWrapper = document.getElementById('text-wrapper');

            timeline.forEach(event => {
                setTimeout(() => {
                    // Handle Screen changes
                    if (event.screen) {
                        // Make phone and credits visible if not already
                        document.getElementById('main-phone').classList.add('visible');
                        document.getElementById('credits').classList.add('visible');
                        
                        // Reset all screenshots
                        document.querySelectorAll('.screenshot').forEach(el => {
                            el.classList.remove('active');
                        });
                        
                        // Activate target screenshot
                        const targetScreen = document.getElementById(event.screen);
                        if (targetScreen) targetScreen.classList.add('active');
                    }

                    // Handle Text changes
                    if (event.text) {
                        // Create a new text element to trigger animation cleanly
                        const p = document.createElement('p');
                        p.className = 'presentation-text';
                        p.innerHTML = event.text;
                        
                        // Set animation duration dynamically based on the event duration
                        p.style.animation = `textFadeIn ${event.duration / 1000}s ease-in-out forwards`;
                        
                        textWrapper.innerHTML = ''; // Clear previous
                        textWrapper.appendChild(p);

                        // TEXT-TO-SPEECH (DETAILED ACADEMIC NARRATION)
                        if ('speechSynthesis' in window) {
                            window.speechSynthesis.cancel(); // Stop any currently playing audio
                            
                            // Prefer spokenText if available, otherwise fallback to standard text
                            let rawText = event.spokenText ? event.spokenText : event.text;
                            
                            // Remove HTML tags for clean reading
                            let cleanText = rawText.replace(/<[^>]*>?/gm, '');
                            
                            let utterance = new SpeechSynthesisUtterance(cleanText);
                            utterance.lang = 'en-GB'; 
                            utterance.rate = 0.85; // Very slow, calm, detailed pace
                            utterance.pitch = 0.85; // Deep, serious, academic tone
                            
                            // Attempt to select a premium British voice if available
                            let voices = window.speechSynthesis.getVoices();
                            let goodVoice = voices.find(v => v.lang === 'en-GB' && v.name.includes('Male')) 
                                         || voices.find(v => v.lang === 'en-GB') 
                                         || voices.find(v => v.lang.startsWith('en'));
                            if (goodVoice) utterance.voice = goodVoice;
                            
                            window.speechSynthesis.speak(utterance);
                        }
                    }

                    // Final Logo
                    if (event.triggerFinal) {
                        document.getElementById('main-phone').classList.remove('visible');
                        document.getElementById('credits').classList.remove('visible');
                        textWrapper.innerHTML = '';
                        setTimeout(() => {
                            document.getElementById('logo-final').style.opacity = '1';
                        }, 1000);
                    }

                }, event.time);
            });
        }
    </script>
</body>
</html>
