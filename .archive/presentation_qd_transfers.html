<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QD Transfers Presentation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@900&display=swap');
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .text-layer {
      position: absolute;
      text-align: center;
      z-index: 10;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .title {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 6vw;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0;
    }

    .subtitle {
      font-size: 1.5vw;
      text-transform: uppercase;
      letter-spacing: 0.5em;
      color: #888;
      margin-top: 20px;
    }

    .highlight {
      color: #fff;
      text-shadow: 0 0 40px rgba(255,255,255,0.5);
    }

    #video-container {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      transform: scale(1.1);
    }

    video {
      width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 100px rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
    }

    #grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      opacity: 0.5;
    }

    .scanline {
      width: 100%;
      height: 100px;
      background: linear-gradient(0deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
      opacity: 0.1;
      position: absolute;
      bottom: 100%;
      animation: scanline 8s linear infinite;
      z-index: 20;
      pointer-events: none;
    }

    @keyframes scanline {
      0% { bottom: 100%; }
      100% { bottom: -100px; }
    }

    #start-btn {
      position: absolute;
      z-index: 100;
      padding: 20px 40px;
      font-size: 24px;
      background: white;
      color: black;
      border: none;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255,255,255,0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  
  <div id="grid"></div>
  <div class="scanline"></div>

  <button id="start-btn">Play Presentation</button>

  <div id="container">
    
    <!-- Scene 1 -->
    <div class="text-layer" id="scene1">
      <div class="subtitle">INFRASTRUCTURE</div>
      <div class="title">AZTEC NETWORK <span class="highlight">V5</span></div>
    </div>

    <!-- Scene 2 -->
    <div class="text-layer" id="scene2">
      <div class="subtitle">CONFIDENTIALITY GUARANTEED</div>
      <div class="title">ZERO KNOWLEDGE.</div>
      <div class="title">ZERO TRACE.</div>
    </div>

    <!-- Scene 3 -->
    <div class="text-layer" id="scene3">
      <div class="subtitle">THE WAIT IS OVER</div>
      <div class="title">QDs TRANSFERS</div>
      <div class="title"><span class="highlight">ARE NOW LIVE</span></div>
    </div>

    <!-- Video Scene -->
    <div id="video-container">
      <video id="main-video" src="public/media/qd_transfer.mp4" playsinline preload="auto"></video>
    </div>

    <!-- Outro -->
    <div class="text-layer" id="scene-outro">
      <div class="title">LEDGER NETWORK</div>
      <div class="subtitle">PRIVATE BY DEFAULT. NO EXCEPTIONS.</div>
    </div>

  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('main-video');
    const tl = gsap.timeline({ paused: true });

    // Setup timeline
    tl.to(startBtn, { opacity: 0, duration: 0.5, onComplete: () => startBtn.style.display = 'none' })
      
      // Scene 1
      .to('#scene1', { opacity: 1, scale: 1.1, duration: 2, ease: "power2.out" })
      .to('#scene1', { opacity: 0, scale: 1.2, duration: 1, ease: "power2.in" }, "+=1")
      
      // Scene 2
      .fromTo('#scene2', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 2, ease: "power3.out" })
      .to('#scene2', { opacity: 0, scale: 1.1, duration: 1, ease: "power2.in" }, "+=1")
      
      // Scene 3
      .fromTo('#scene3', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.5, ease: "back.out(1.7)" })
      .to('#scene3', { opacity: 0, y: -50, duration: 1, ease: "power2.in" }, "+=1.5")
      
      // Video
      .to('#video-container', { opacity: 1, scale: 1, duration: 1.5, ease: "power3.out", onStart: () => video.play() })
      
      // We will pause the timeline here, and let the video play. 
      // An event listener on the video will resume the timeline when the video is near the end.
      .addPause()

      // Outro
      .to('#video-container', { opacity: 0, scale: 0.9, duration: 1, ease: "power2.in" })
      .fromTo('#scene-outro', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 3, ease: "power4.out" });

    // Video end listener
    video.addEventListener('timeupdate', () => {
      // Resume timeline 1 second before video ends
      if(video.currentTime >= video.duration - 1 && video.duration > 0) {
        if(!tl.isActive()) {
          tl.play();
        }
      }
    });

    startBtn.addEventListener('click', () => {
      // Fullscreen request for best recording
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(()=>{});
      }
      tl.play();
    });
  </script>
</body>
</html>
