version: '3.8'

services:
  # Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "next", "start", "-p", "3000", "-H", "0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - system-net


  # Aztec Sandbox (Sequencer + Prover + Node + PXE)
  aztec-sandbox:
    image: aztecprotocol/aztec-sandbox:4.3.1
    ports:
      - "8080:8080" # PXE
      - "8081:8081" # Node
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
      - AZTEC_CHAIN_ID=aztec-testnet-2026
      - BARRETENBERG_BACKEND=ultrahonk
    networks:
      - system-net

networks:
  system-net:

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
