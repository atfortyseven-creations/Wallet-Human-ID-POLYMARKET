<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Provenance - Cinematic Trailer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: #000;
            transition: opacity 1.5s ease;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 6px;
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-align: center;
        }

        .play-btn {
            padding: 18px 50px;
            border: 1px solid rgba(255,255,255,0.4);
            background: transparent;
            color: white;
            font-size: 1.1rem;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.5s ease;
            text-transform: uppercase;
        }

        .play-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255,255,255,0.6);
            transform: scale(1.02);
        }

        #player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1);
        }

        .scene-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.85) 100%);
            z-index: 5;
        }

        .scene-text {
            position: absolute;
            z-index: 10;
            font-size: 3.5vw;
            font-weight: 200;
            text-align: center;
            max-width: 85%;
            opacity: 0;
            letter-spacing: 2px;
            text-shadow: 0 4px 30px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.5);
            line-height: 1.5;
        }

        .highlight {
            font-weight: 700;
            color: #fbd34d; /* Humanity Ledger Yellow */
        }

        /* Animations */
        .animate-bg {
            animation: kenburns 8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards, fade 8s ease-in-out forwards;
        }
        
        .animate-bg-long {
            animation: kenburns 12s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards, fade 12s ease-in-out forwards;
        }

        .animate-text {
            animation: textFade 6s ease-in-out forwards;
        }

        @keyframes kenburns {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        @keyframes fade {
            0% { opacity: 0; filter: blur(15px); }
            15% { opacity: 0.7; filter: blur(0px); }
            85% { opacity: 0.7; filter: blur(0px); }
            100% { opacity: 0; filter: blur(15px); }
        }

        @keyframes textFade {
            0% { opacity: 0; transform: translateY(25px); filter: blur(8px); }
            20% { opacity: 1; transform: translateY(0); filter: blur(0); }
            80% { opacity: 1; transform: translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-25px); filter: blur(8px); }
        }

        #logo-final {
            position: absolute;
            z-index: 20;
            text-align: center;
            opacity: 0;
            transition: opacity 3s ease;
        }

        #logo-final h2 {
            font-size: 5.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        #logo-final .vision {
            font-size: 1.8rem;
            font-weight: 400;
            color: #fbd34d;
            margin-top: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        #logo-final .tags {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #fff;
            margin-top: 50px;
        }

        #logo-final .tags span {
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        #logo-final .tags span:hover {
            opacity: 1;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

    </style>
</head>
<body>

    <div id="intro-screen">
        <h1>The Origin is Lost.</h1>
        <button class="play-btn" onclick="startTrailer()">Restore Truth</button>
    </div>

    <div id="player">
        <!-- Overlay for better text readability -->
        <div class="scene-overlay"></div>

        <!-- Backgrounds -->
        <div id="bg1" class="scene-bg" style="background-image: url('file:///C:/Users/admin/.gemini/antigravity/brain/518ca4ce-e5fa-4f52-9b6b-2bafd043141d/act_one_shadows_1780386618049.png');"></div>
        <div id="bg2" class="scene-bg" style="background-image: url('file:///C:/Users/admin/.gemini/antigravity/brain/518ca4ce-e5fa-4f52-9b6b-2bafd043141d/act_two_trust_1780386630617.png');"></div>
        <div id="bg3" class="scene-bg" style="background-image: url('file:///C:/Users/admin/.gemini/antigravity/brain/518ca4ce-e5fa-4f52-9b6b-2bafd043141d/act_three_digital_1780386641322.png');"></div>
        <div id="bg4" class="scene-bg" style="background-image: url('file:///C:/Users/admin/.gemini/antigravity/brain/518ca4ce-e5fa-4f52-9b6b-2bafd043141d/act_five_aztec_1780386653189.png');"></div>

        <!-- Texts -->
        <div id="text-container" class="scene-text"></div>

        <!-- Final Logo -->
        <div id="logo-final">
            <h2>Studio Provenance</h2>
            <div class="vision">Truth, Mathematically Guaranteed</div>
            <div class="tags">
                <span>@whalecosystem</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span>@AztecLabs_</span>
            </div>
        </div>
    </div>

    <script>
        const timeline = [
            // ACT I (Shadows)
            { time: 1000, bg: 'bg1', text: "We live in an era of unprecedented connection...", textClass: 'animate-text', bgClass: 'animate-bg-long' },
            { time: 6500, text: "yet profound disconnection.", textClass: 'animate-text' },
            { time: 12000, text: "The origin of what we consume is lost.", textClass: 'animate-text' },
            
            // ACT II (Cube/Trust)
            { time: 17500, bg: 'bg2', text: "It’s time to engineer trust from the ground up.", textClass: 'animate-text', bgClass: 'animate-bg-long' },
            { time: 23000, text: "Enter <span class='highlight'>Studio Provenance</span>.", textClass: 'animate-text' },
            
            // ACT III (Digital)
            { time: 29000, bg: 'bg3', text: "Frictionless Digitization.", textClass: 'animate-text', bgClass: 'animate-bg-long' },
            { time: 34500, text: "Physical atoms bound to cryptographic bits.", textClass: 'animate-text' },

            // ACT V (Aztec)
            { time: 40500, bg: 'bg4', text: "Secured by <span class='highlight'>Aztec Network</span>.", textClass: 'animate-text', bgClass: 'animate-bg-long' },
            { time: 46000, text: "Zero-knowledge cryptography.", textClass: 'animate-text' },
            { time: 51500, text: "Public verification. <span class='highlight'>Private data.</span>", textClass: 'animate-text' },

            // OUTRO
            { time: 58000, triggerFinal: true }
        ];

        function startTrailer() {
            // Request fullscreen for immersive experience
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            }

            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('player').style.opacity = '1';
                runTimeline();
            }, 1500);
        }

        function runTimeline() {
            let textContainer = document.getElementById('text-container');

            timeline.forEach(event => {
                setTimeout(() => {
                    // Handle Background changes
                    if (event.bg) {
                        // Reset all BGs
                        document.querySelectorAll('.scene-bg').forEach(el => {
                            el.className = 'scene-bg';
                        });
                        // Trigger new BG
                        let bgEl = document.getElementById(event.bg);
                        void bgEl.offsetWidth; // trigger reflow
                        bgEl.classList.add(event.bgClass);
                    }

                    // Handle Text changes
                    if (event.text) {
                        textContainer.className = 'scene-text'; // reset
                        void textContainer.offsetWidth; // trigger reflow
                        textContainer.innerHTML = event.text;
                        textContainer.classList.add(event.textClass);
                    }

                    // Final Logo
                    if (event.triggerFinal) {
                        // Fade out the overlay for the final crisp logo presentation
                        document.querySelector('.scene-overlay').style.transition = "opacity 3s ease";
                        document.querySelector('.scene-overlay').style.opacity = "0.4";
                        
                        document.getElementById('logo-final').style.opacity = '1';
                    }

                }, event.time);
            });
        }
    </script>
</body>
</html>
