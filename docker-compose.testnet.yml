version: '3.8'

services:
  # Alpha Testnet PXE Sidecar
  # Connects directly to the live v5 Testnet Node
  aztec-pxe:
    image: aztecprotocol/aztec:latest
    command: ["start", "--pxe"]
    ports:
      - "18080:8080"
    environment:
      - AZTEC_NODE_URL=https://v5.testnet.rpc.aztec-labs.com/
      - PORT=8080
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
